name: NORTHSTAR Web Qualification

on:
  push:
    branches:
      - northstar-5.0.0-development
    paths:
      - "apps/web/**"
      - ".github/workflows/northstar-web-qualification.yml"
  pull_request:
    branches:
      - northstar-5.0.0-development
    paths:
      - "apps/web/**"
      - ".github/workflows/northstar-web-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update npm installer
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report=require("./audit-report.json"); for (const [name,item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + " range=" + item.range + " fix=" + JSON.stringify(item.fixAvailable) + " via=" + JSON.stringify(item.via))'
      - name: Domain tests
        run: npm run test
      - name: Build
        run: npm run build
