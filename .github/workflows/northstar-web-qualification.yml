name: NORTHSTAR Web Qualification

on:
  push:
    branches:
      - northstar-5.0.0-development
    paths:
      - "apps/web/**"
      - ".github/workflows/northstar-web-qualification.yml"
  pull_request:
    branches:
      - northstar-5.0.0-development
    paths:
      - "apps/web/**"
      - ".github/workflows/northstar-web-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update npm installer
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile install
        run: npm ci --no-audit --no-fund
      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: northstar-web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
      - name: Commit lockfile to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/northstar-5.0.0-development'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(northstar): add deterministic web dependency lock"
            git push origin HEAD:northstar-5.0.0-development
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report=require("./audit-report.json"); for (const [name,item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + " range=" + item.range + " fix=" + JSON.stringify(item.fixAvailable) + " via=" + JSON.stringify(item.via))'
      - name: Domain tests
        run: npm run test
      - name: Build
        run: npm run build
