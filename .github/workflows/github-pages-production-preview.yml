name: NORTHSTAR GitHub Pages — Production + Preview

on:
  # Production and preview are published together from the default branch.
  push:
    branches:
      - main

  # A successful Phase 4 push test automatically refreshes /preview/.
  workflow_run:
    workflows:
      - NORTHSTAR Phase 4 tests
    types:
      - completed
    branches:
      - northstar-0.4.4.2-quiz-continuity

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: northstar-github-pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run can also be fired by PR checks; publish only after a
    # successful push test from the development branch.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-production

      - name: Check out latest Phase 4 development source
        uses: actions/checkout@v4
        with:
          ref: northstar-0.4.4.2-quiz-continuity
          path: source-preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble and verify production and preview sites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/preview

          copy_dashboard() {
            local source="$1"
            local destination="$2"

            test -f "$source/index.html"
            test -f "$source/manifest.json"
            test -d "$source/styles"
            test -d "$source/scripts"

            cp "$source/index.html" "$destination/index.html"
            cp "$source/manifest.json" "$destination/manifest.json"
            cp -R "$source/styles" "$destination/styles"
            cp -R "$source/scripts" "$destination/scripts"
            touch "$destination/.nojekyll"
          }

          copy_dashboard source-production _site
          copy_dashboard source-preview _site/preview

          grep -Fq 'NORTHSTAR / .4.4.1' _site/index.html
          grep -Fq 'NORTHSTAR / .4.4.5' _site/preview/index.html
          test -f _site/preview/styles/main.css
          test -f _site/preview/styles/assignment-room.css
          test -f _site/preview/scripts/assignment-room.js
          test -f _site/preview/scripts/workspace.js
          test -f _site/preview/manifest.json
          test -f _site/preview/.nojekyll

          echo "Verified production version: 0.4.4.1"
          echo "Verified preview version: 0.4.4.5"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production and preview
        id: deployment
        uses: actions/deploy-pages@v4
