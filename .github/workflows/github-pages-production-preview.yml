name: NORTHSTAR GitHub Pages — Production + Preview

on:
  # Publish only after the corresponding Phase 4 test suite succeeds.
  workflow_run:
    workflows:
      - NORTHSTAR Phase 4 tests
    types:
      - completed
    branches:
      - main
      - northstar-0.4.4.2-quiz-continuity
      - northstar-4.4.8.1.1-document-studio-verification
      - northstar-4.4.8.2-canvas-submission

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: northstar-github-pages
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
      preview_sha: ${{ steps.verify.outputs.preview_sha }}
    steps:
      - name: Verify both source branches have passing Phase 4 runs at their current heads
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const branches = [
            ['main', 'main_sha'],
            ['northstar-4.4.8.2-canvas-submission', 'preview_sha']
          ];
          async function api(path) {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              headers: {
                Authorization: 'Bearer ' + token,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!response.ok) throw new Error('GitHub API ' + response.status + ' for ' + path);
            return response.json();
          }
          (async () => {
            let publish = true;
            const outputs = [];
            for (const [branch, outputName] of branches) {
              const branchInfo = await api('/branches/' + encodeURIComponent(branch));
              const sha = branchInfo.commit.sha;
              const query = '?branch=' + encodeURIComponent(branch) + '&event=push&status=completed&per_page=100';
              const history = await api('/actions/workflows/northstar-phase4.yml/runs' + query);
              const passed = history.workflow_runs.some(run =>
                run.head_sha === sha && run.event === 'push' && run.conclusion === 'success'
              );
              outputs.push(outputName + '=' + sha);
              if (!passed) {
                publish = false;
                console.log('HOLD: ' + branch + ' at ' + sha + ' has no successful Phase 4 push run. No Pages artifact will be published.');
              } else {
                console.log('PASS: ' + branch + ' at ' + sha + ' has a successful Phase 4 push run.');
              }
            }
            outputs.push('publish=' + String(publish));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, outputs.join('\n') + '\n');
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  build:
    needs: freshness
    if: needs.freshness.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified production source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.freshness.outputs.main_sha }}
          path: source-production

      - name: Check out verified preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.freshness.outputs.preview_sha }}
          path: source-preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble and verify production and preview sites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/preview

          copy_dashboard() {
            local source="$1"
            local destination="$2"

            test -f "$source/index.html"
            test -f "$source/manifest.json"
            test -d "$source/styles"
            test -d "$source/scripts"

            cp "$source/index.html" "$destination/index.html"
            cp "$source/manifest.json" "$destination/manifest.json"
            if [[ -f "$source/release.json" ]]; then cp "$source/release.json" "$destination/release.json"; fi
            cp -R "$source/styles" "$destination/styles"
            cp -R "$source/scripts" "$destination/scripts"
            touch "$destination/.nojekyll"
          }

          # Keep the existing production dashboard at the normal Pages URL.
          copy_dashboard source-production _site

          # Publish the latest tested development dashboard under /preview/.
          copy_dashboard source-preview _site/preview

          verify_release() {
            local source="$1"
            local label="$2"
            if [[ ! -f "$source/release.json" ]]; then
              echo "$label uses a legacy build without the NORTHSTAR release manifest."
              return 0
            fi
            node -e '
              const fs = require("fs");
              const path = process.argv[1];
              const release = JSON.parse(fs.readFileSync(path + "/release.json", "utf8"));
              const pkg = JSON.parse(fs.readFileSync(path + "/package.json", "utf8"));
              const html = fs.readFileSync(path + "/index.html", "utf8");
              if (!release.northstarVersion || pkg.northstarRelease !== release.northstarVersion) throw new Error("Release manifest and package metadata disagree");
              if (!html.includes("versionPill") || !html.includes("scripts/release.js")) throw new Error("Visible version/changelog controls are missing");
              console.log("Verified " + process.argv[2] + " release: " + release.northstarVersion + " (package " + pkg.version + ")");
            ' "$source" "$label"
          }

          verify_release source-production production
          verify_release source-preview preview

          test -f _site/preview/styles/main.css
          test -f _site/preview/styles/assignment-room.css
          test -f _site/preview/styles/release-notes.css
          test -f _site/preview/scripts/assignment-room.js
          test -f _site/preview/scripts/document-editor.js
          test -f _site/preview/scripts/release.js
          test -f _site/preview/scripts/workspace.js
          test -f _site/preview/manifest.json
          test -f _site/preview/release.json
          test -f _site/preview/.nojekyll

          echo "Preview includes the release manifest, Document Studio editor, and in-app changelog."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [freshness, build]
    if: needs.freshness.outputs.publish == 'true' && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production and preview
        id: deployment
        uses: actions/deploy-pages@v4
