name: NORTHSTAR Phase 3 tests

on:
  push:
    branches:
      - northstar-0.4.3-phase-3-studentvue
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          for file in scripts/*.js canvas-bridge/*.js; do
            node --check "$file"
          done
      - name: Run unit and browser boot tests
        run: npm test
