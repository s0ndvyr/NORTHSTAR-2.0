name: NORTHSTAR Phase 4 tests

on:
  push:
    branches:
      - main
      - northstar-0.4.4-phase-4-assignment-workspace
      - northstar-0.4.4.1-native-assignment-experience
      - northstar-0.4.4.2-quiz-continuity
      - northstar-4.4.7.6-canvas-pdf-recovery
      - northstar-4.4.7.7-canvas-download-ua
      - northstar-4.4.7.8-canvas-public-url
      - northstar-4.4.8.0-native-pdf-delivery
      - northstar-4.4.8.1-document-studio
      - northstar-4.4.7.9-canvas-signed-preview-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          for file in scripts/*.js canvas-bridge/*.js; do
            node --check "$file"
          done
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --config wrangler.jsonc --dry-run
      - name: Run unit and browser boot tests
        run: npm test
